name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go vet
        # Cross-compiled to match scripts/build.sh's actual GOOS/GOARCH: this
        # plugin's entry point is behind a `//go:build wasip1` tag, so host
        # `go vet ./...` silently skips it entirely (ut-docs#166 review).
        run: GOOS=wasip1 GOARCH=wasm go vet ./...
      - name: go test
        # Host GOOS/GOARCH: only the untagged files (convert.go, demo.go) and
        # their tests compile here; main.go's wasip1-only host imports don't.
        # CI never ran these tests before ut-docs#3057.
        run: go test ./...
      - name: gofmt check
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "gofmt found unformatted files:" >&2
            echo "$fmt_out" >&2
            exit 1
          fi
      - name: Build WASI module
        run: scripts/build.sh
      - name: Validate manifest + plugin manifest
        run: scripts/validate.sh
      - name: Guard plugin i18n (locale key drift)
        run: scripts/guard-plugin-i18n.sh
      - name: Package (dry run)
        run: scripts/package.sh
